[project]
name = "wheelhouse-ipod"
version = "0.1.0"
description = "Sync iPods running stock firmware from Navidrome"
license = { text = "GPL-3.0-or-later" }
requires-python = "==3.12.*"
dependencies = [
    "iopenpod @ git+https://github.com/TheRealSavi/iOpenPod@f9c9f1ec30fd9b5caec4e8026e015441b3aaf0a3",
    "click>=8.1",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "mutagen>=1.47",
    "pillow>=10.0",
    "requests>=2.32",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.scripts]
wheelhouse = "wheelhouse.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/wheelhouse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
